; GESTOCK · Recepción Inteligente IoT — proyecto PlatformIO para el ESP32.
; Alternativa a Arduino IDE (gestiona las dependencias automáticamente).
;
;   pio run              -> compila
;   pio run -t upload    -> flashea
;   pio device monitor   -> monitor serie
;
; Recuerda copiar `config.example.h` como `config.h` antes de compilar.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.3
    madhephaestus/ESP32Servo@^3.0.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
