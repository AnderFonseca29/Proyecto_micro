<header class="header">
  <div class="marca">
    <!-- Logo: caja con flechas de clasificación -->
    <svg class="logo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect x="3" y="6" width="26" height="21" rx="4" stroke="url(#g1)" stroke-width="2.2" />
      <path d="M3 13h26" stroke="url(#g1)" stroke-width="2.2" />
      <path d="M9 19l-3 3 3 3" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M20 19l3 3-3 3" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M14.5 22h3" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" />
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="32" y2="32">
          <stop stop-color="#4F46E5" />
          <stop offset="1" stop-color="#06B6D4" />
        </linearGradient>
      </defs>
    </svg>
    <div class="marca-texto">
      <span class="marca-nombre">GESTOCK</span>
      <span class="marca-sub">SIGAD · Gestión Inteligente de Activos y Demanda</span>
    </div>
  </div>

  <nav class="nav" aria-label="Secciones">
    <a
      routerLink="/"
      routerLinkActive="activo"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-enlace">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
        <rect x="3" y="3" width="7" height="9" rx="2" stroke-width="1.8" />
        <rect x="14" y="3" width="7" height="5" rx="2" stroke-width="1.8" />
        <rect x="14" y="12" width="7" height="9" rx="2" stroke-width="1.8" />
        <rect x="3" y="16" width="7" height="5" rx="2" stroke-width="1.8" />
      </svg>
      Panel
    </a>
    <a routerLink="/recepcion" routerLinkActive="activo" class="nav-enlace">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
        <path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="12" cy="12" r="3.2" stroke-width="1.8" />
      </svg>
      Recepción
    </a>
  </nav>

  <div class="indicadores">
    <app-status-dot [estado]="estadoServidor()" [etiqueta]="etiquetaServidor()" />
    <app-status-dot
      [estado]="estadoDispositivo()"
      [etiqueta]="etiquetaDispositivo()"
      [pulsante]="store.deviceOnline()" />
  </div>
</header>
